schema: w512_phase4a_canonical
arm: W512-Reset128-OrigVtrace

scientific_config:
  # ---- the fixed W512 canonical scientific contract (match Base/RMT16 EXCEPT capacity) ----
  network_family: W512
  carry_mode: reset128
  replay_mode: original_vtrace
  allow_full_p2_legacy: false
  sequence_length: 129
  segment_len: 128
  crosses_boundary: true
  hindsight: false
  awr: false
  w_original_vtrace: 1.0

  # step0 / base (SAME frozen base checkpoint as Base/RMT16)
  base_checkpoint: ckpt17500
  seed: 42

  # LONG budget: 48 * 2048 = 98304 resolved env steps; checkpoint every 8192 env steps.
  total_updates: 48
  save_every: 4

  # env / task
  num_envs: 16
  num_steps: 128
  task: DEFEAT_KOBOLD
  optimistic_reset_ratio: 16
  condition_on_task: true

  # replay protocol (FROZEN P2)
  replay_batch_size: 4
  replay_buffer_capacity: 64
  anchor_interval: 128
  min_sequence_length: 129
  eligible_only_sampling: true

  # on-policy PPO (FROZEN)
  ppo:
    lr: 2.0e-5
    max_grad_norm: 1.0
    gamma: 0.999
    gae_lambda: 0.8
    clip_eps: 0.2
    vf_coef: 0.5
    ent_coef: 0.002
    update_epochs: 1
    num_minibatches: 2
    value_target_clip_min: -50.0
    value_target_clip_max: 300.0

  # V-trace (FROZEN)
  vtrace:
    rho_bar: 1.0
    c_bar: 1.0
    vt_clip_min: -50.0
    vt_clip_max: 300.0

  kl_replay_max: 0.05
  kl_run_max: 0.1
  actor_step_scales: [1.0, 0.5, 0.25, 0.125]
  ema_tau: 0.995
  ent_floor: 0.05
  grad_clip: 1.0
  adam_eps: 1.0e-5

  # network (W512: SAME trunk as RMT16, EXCEPT the raw-history capacity block)
  network:
    network_family: W512
    activation: relu
    embed_size: 256
    num_heads: 8
    qkv_features: 256
    num_layers: 2
    gating: true
    gating_bias: 2.0
    window_mem: 128
    w512_long_size: 384
    w512_delay_size: 128
    w512_encoder_size: 256

  evaluator: frozen_w512_evaluator

